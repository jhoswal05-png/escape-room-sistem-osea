<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorio de Osteología · Escape Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fdf6ec;
    --panel: #ffffff;
    --panel-2: #fff2e2;
    --line: #f0dfc7;
    --ink: #5c4b3a;
    --ink-dim: #a3907c;
    --blue: #8ec9e0;
    --blue-dim: #eaf5fa;
    --pink: #f0a6a0;
    --peach: #f5b878;
    --danger: #ef8b83;
    --good: #8fc9a0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(142,201,224,0.25), transparent 45%),
      radial-gradient(circle at 88% 15%, rgba(245,184,120,0.22), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(240,166,160,0.18), transparent 50%),
      var(--bg);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    min-height:100%;
    display:flex;
  }
  ::selection{ background: var(--blue); color:#fff; }

  /* ---------- SPINE PROGRESS (signature element, ahora como collar de huesitos) ---------- */
  .spine-rail{
    width:84px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 0;
    gap:10px;
    background:linear-gradient(180deg, #ffffff, #fff2e2);
    border-right:3px dashed var(--line);
  }
  .spine-label{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:2px;
    color:var(--ink-dim);
    margin-bottom:10px;
  }
  .vertebra{
    width:38px;
    height:26px;
    border-radius:14px;
    background:var(--panel-2);
    border:2px solid var(--line);
    position:relative;
    transition:all .5s ease;
    box-shadow:0 3px 0 var(--line);
  }
  .vertebra::after{
    content:'🦴';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    filter:grayscale(1) opacity(0.35);
    transition:all .5s ease;
  }
  .vertebra.lit{
    background:linear-gradient(180deg, #d7f0da, #c3e8c9);
    border-color:var(--good);
    box-shadow:0 3px 0 #6fae7f;
  }
  .vertebra.lit::after{ filter:none; }
  .vertebra.current{
    border-color:var(--peach);
    box-shadow:0 3px 0 #d99a54;
    transform:scale(1.08);
  }
  .vertebra.current::after{ filter:grayscale(0.2) opacity(0.9); }

  /* ---------- MAIN AREA ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:920px;
    margin:0 auto;
    padding:36px 40px 60px;
    width:100%;
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:28px;
    border-bottom:3px dashed var(--line);
    padding-bottom:18px;
  }
  .brand{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    color:var(--peach);
  }
  .brand-sub{
    font-size:12px;
    color:var(--ink-dim);
    margin-top:4px;
    font-family:'Nunito', sans-serif;
    font-weight:600;
  }
  .timer{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:30px;
    color:var(--blue);
    letter-spacing:1px;
  }
  .timer.low{ color:var(--danger); }

  h1.room-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 4vw, 40px);
    margin:0 0 6px;
    line-height:1.1;
    color:var(--ink);
  }
  .room-eyebrow{
    display:inline-block;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:#fff;
    background:var(--peach);
    padding:4px 12px;
    border-radius:20px;
    margin-bottom:12px;
  }
  .briefing{
    color:var(--ink-dim);
    font-size:15px;
    line-height:1.6;
    max-width:640px;
    margin-bottom:28px;
    font-weight:600;
  }

  .challenge-card{
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:18px;
    padding:22px 24px;
    margin-bottom:16px;
    box-shadow:0 4px 0 var(--line);
  }
  .q-text{ font-size:15px; margin-bottom:12px; font-weight:700; }
  .q-text b{ color:var(--peach); font-weight:800; }
  .options{ display:flex; flex-wrap:wrap; gap:8px; }
  .opt-btn{
    background:var(--panel-2);
    border:2px solid var(--line);
    color:var(--ink);
    padding:9px 16px;
    border-radius:20px;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .opt-btn:hover{ border-color:var(--blue); transform:translateY(-1px); }
  .opt-btn.selected{ border-color:var(--blue); background:var(--blue-dim); color:#3a7a94; }
  .opt-btn.correct{ border-color:var(--good); background:#e3f5e6; color:#4a8a5c; }
  .opt-btn.incorrect{ border-color:var(--danger); background:#fbe7e5; color:#c85f56; }
  .opt-btn:disabled{ cursor:default; }

  select.match-select{
    background:var(--panel-2);
    border:2px solid var(--line);
    color:var(--ink);
    padding:8px 12px;
    border-radius:14px;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:14px;
  }
  select.match-select.correct{ border-color:var(--good); }
  select.match-select.incorrect{ border-color:var(--danger); }

  .order-list{ display:flex; flex-direction:column; gap:8px; }
  .order-item{
    background:var(--panel-2);
    border:2px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:grab;
    font-size:14px;
    font-weight:700;
    box-shadow:0 3px 0 var(--line);
  }
  .order-item .handle{ color:var(--ink-dim); font-size:14px; }
  .order-item.dragging{ opacity:0.4; }

  .verify-row{ display:flex; gap:10px; align-items:center; margin-top:20px; flex-wrap:wrap;}
  .btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:12px 22px;
    border-radius:20px;
    border:2px solid var(--blue);
    background:var(--blue);
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 0 #6ba9c2;
    transition:all .1s ease;
  }
  .btn:hover{ transform:translateY(1px); box-shadow:0 3px 0 #6ba9c2; }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; }
  .feedback{ font-size:13px; font-family:'Nunito',sans-serif; font-weight:700; }
  .feedback.good{ color:#4a8a5c; }
  .feedback.bad{ color:#c85f56; }

  .lock-panel{
    margin-top:24px;
    background:#fff8ec;
    border:2px solid var(--peach);
    border-radius:18px;
    padding:22px 24px;
  }
  .lock-panel.disabled{ opacity:0.45; pointer-events:none; }
  .lock-label{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13px;
    color:#fff;
    background:var(--peach);
    display:inline-block;
    padding:3px 12px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .lock-hint{ font-size:13px; color:var(--ink-dim); margin-bottom:14px; line-height:1.5; font-weight:600; }
  .lock-row{ display:flex; gap:10px; }
  .lock-input{
    flex:1;
    background:#ffffff;
    border:2px solid var(--line);
    color:var(--peach);
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:4px;
    padding:10px 14px;
    border-radius:14px;
    text-transform:uppercase;
  }
  .lock-input:focus{ outline:none; border-color:var(--peach); }
  .btn-amber{
    border-color:var(--peach); background:var(--peach); box-shadow:0 4px 0 #d99a54;
  }
  .btn-amber:hover{ box-shadow:0 3px 0 #d99a54; }

  .intro-screen, .end-screen{
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:70vh;
    max-width:600px;
  }
  .intro-screen h1, .end-screen h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:clamp(32px,5vw,52px);
    line-height:1.05;
    margin:0 0 18px;
    color:var(--ink);
  }
  .intro-screen p, .end-screen p{ color:var(--ink-dim); font-size:15px; line-height:1.7; margin-bottom:26px; font-weight:600;}
  .final-code-display{
    font-family:'Baloo 2',sans-serif;
    font-size:15px;
    color:#3a7a94;
    background:var(--blue-dim);
    border:2px solid var(--blue);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:22px;
  }

  @media (max-width:640px){
    .spine-rail{ width:50px; }
    .spine-label{ display:none; }
    main{ padding:24px 18px 40px; }
  }
</style>
</head>
<body>

<div class="spine-rail" id="spineRail">
  <div class="spine-label">PROGRESO</div>
</div>

<main id="app"></main>

<script>
const ROOMS = [
  {
    id: 1,
    title: "Clasificación de los huesos",
    eyebrow: "Sala 01 · Candado 1",
    briefing: "Cada hueso del cuerpo se clasifica según su forma. Identifica correctamente la clasificación de cada hueso listado. Al acertar los cinco, obtendrás una letra por cada uno — ordénalas para formar el código.",
    type: "mcq-set",
    questions: [
      { q: "Fémur", options: ["Largo","Corto","Plano","Irregular","Sesamoideo"], answer: "Largo", letter: "L" },
      { q: "Rótula (patela)", options: ["Largo","Corto","Plano","Irregular","Sesamoideo"], answer: "Sesamoideo", letter: "S" },
      { q: "Vértebra", options: ["Largo","Corto","Plano","Irregular","Sesamoideo"], answer: "Irregular", letter: "I" },
      { q: "Esternón", options: ["Largo","Corto","Plano","Irregular","Sesamoideo"], answer: "Plano", letter: "P" },
      { q: "Escafoides (hueso del carpo)", options: ["Largo","Corto","Plano","Irregular","Sesamoideo"], answer: "Corto", letter: "C" }
    ],
    code: "CLIPS",
    hint: "Las letras obtenidas son: L, S, I, P, C. Ordénalas para formar una palabra de 5 letras."
  },
  {
    id: 2,
    title: "Esqueleto axial y apendicular",
    eyebrow: "Sala 02 · Candado 2",
    briefing: "El esqueleto humano se divide en axial (eje central del cuerpo) y apendicular (extremidades y cinturas). Clasifica correctamente cada hueso.",
    type: "toggle-classify",
    items: [
      { name: "Cráneo", answer: "Axial" },
      { name: "Costillas", answer: "Axial" },
      { name: "Columna vertebral", answer: "Axial" },
      { name: "Clavícula", answer: "Apendicular" },
      { name: "Húmero", answer: "Apendicular" },
      { name: "Coxal (cadera)", answer: "Apendicular" },
      { name: "Fémur", answer: "Apendicular" },
      { name: "Esternón", answer: "Axial" }
    ],
    code: "206",
    hint: "El código es el número total de huesos en el esqueleto de un adulto."
  },
  {
    id: 3,
    title: "Funciones del sistema óseo",
    eyebrow: "Sala 03 · Candado 3",
    briefing: "El sistema óseo cumple varias funciones vitales más allá de sostener el cuerpo. Responde correctamente cada pregunta.",
    type: "mcq-set",
    questions: [
      { q: "¿Qué función ósea se relaciona con la producción de células sanguíneas?", options: ["Protección","Hematopoyesis","Sostén","Palanca"], answer: "Hematopoyesis" },
      { q: "¿Qué función permite el movimiento junto con los músculos?", options: ["Mecánica (palanca)","Metabólica","Hematopoyética","Sostén"], answer: "Mecánica (palanca)" },
      { q: "¿Qué minerales almacenan principalmente los huesos?", options: ["Hierro y zinc","Calcio y fósforo","Sodio y potasio","Magnesio y yodo"], answer: "Calcio y fósforo" },
      { q: "¿Qué función cumplen el cráneo y la caja torácica?", options: ["Protección de órganos","Hematopoyesis","Palanca","Almacenamiento de grasa"], answer: "Protección de órganos" },
      { q: "¿Qué función le da al cuerpo su forma general?", options: ["Sostén / soporte","Metabólica","Hematopoyesis","Protección"], answer: "Sostén / soporte" }
    ],
    code: "54321",
    hint: "Contaste 5 funciones correctamente. El código es la cuenta regresiva desde ese número: 5-4-3-2-1."
  },
  {
    id: 4,
    title: "Regiones anatómicas longitudinales",
    eyebrow: "Sala 04 · Candado 4",
    briefing: "Todo hueso largo se divide en regiones a lo largo de su eje. Ordénalas desde el extremo proximal (arriba) hasta el distal (abajo), tal como aparecen en un fémur.",
    type: "order",
    items: [
      { id: "epi-prox", label: "Epífisis proximal" },
      { id: "meta-prox", label: "Metáfisis proximal" },
      { id: "dia", label: "Diáfisis" },
      { id: "meta-dist", label: "Metáfisis distal" },
      { id: "epi-dist", label: "Epífisis distal" }
    ],
    correctOrder: ["epi-prox","meta-prox","dia","meta-dist","epi-dist"],
    code: "DIAFISIS",
    hint: "La región central que ordenaste en la posición 3 es también el código de este candado."
  }
];

let currentRoom = -1; // -1 = intro
let timeLeft = 25 * 60;
let timerInterval = null;
let roomState = {}; // per-room interaction state
const MAX_LIVES = 3;
let lives = MAX_LIVES;

function renderLives(){
  const el = document.getElementById('livesDisplay');
  if(!el) return;
  el.innerHTML = Array.from({length: MAX_LIVES}, (_, i) =>
    `<span style="opacity:${i < lives ? 1 : 0.25}; filter:${i < lives ? 'none' : 'grayscale(1)'};">🦴</span>`
  ).join(' ');
}

function loseLife(){
  if(lives <= 0) return;
  lives--;
  renderLives();
  if(lives <= 0){
    clearInterval(timerInterval);
    setTimeout(() => goToRoom(-2), 900); // -2 = game over
  }
}

function startTimer(){
  timerInterval = setInterval(() => {
    timeLeft--;
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      timeLeft = 0;
    }
    renderTimer();
  }, 1000);
}
function renderTimer(){
  const el = document.getElementById('timerDisplay');
  if(!el) return;
  const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s = String(timeLeft%60).padStart(2,'0');
  el.textContent = `${m}:${s}`;
  el.classList.toggle('low', timeLeft <= 120);
}

function renderSpine(){
  const rail = document.getElementById('spineRail');
  rail.querySelectorAll('.vertebra').forEach(v => v.remove());
  ROOMS.forEach((r, i) => {
    const v = document.createElement('div');
    v.className = 'vertebra';
    if(i < currentRoom) v.classList.add('lit');
    if(i === currentRoom) v.classList.add('current');
    rail.appendChild(v);
  });
}

function goToRoom(idx){
  currentRoom = idx;
  renderSpine();
  render();
}

function render(){
  const app = document.getElementById('app');
  if(currentRoom === -2){ renderGameOver(app); return; }
  if(currentRoom === -1){ renderIntro(app); return; }
  if(currentRoom >= ROOMS.length){ renderEnd(app); return; }
  renderRoom(app, ROOMS[currentRoom]);
}

function renderGameOver(app){
  clearInterval(timerInterval);
  app.innerHTML = `
    <div class="end-screen">
      <div class="room-eyebrow" style="background:var(--danger);">Game Over</div>
      <h1>Te quedaste sin vidas 🦴💔</h1>
      <p>Fallaste 3 veces y la alarma nocturna se activó antes de que pudieras salir. No te preocupes, puedes volver a intentarlo desde el inicio.</p>
      <div>
        <button class="btn" onclick="location.reload()">Intentar de nuevo</button>
      </div>
    </div>`;
}

function renderIntro(app){
  app.innerHTML = `
    <div class="intro-screen">
      <div class="room-eyebrow">Laboratorio de Osteología · Facultad de Ciencias de la Salud</div>
      <h1>Atrapado en el laboratorio</h1>
      <p>Son las 23:40. Quedaste encerrado terminando un modelo de esqueleto para tu evaluación. La puerta principal tiene un sistema de 4 candados que solo se abren resolviendo retos sobre el sistema óseo. Tienes 25 minutos antes de que se active la alarma nocturna.</p>
      <div>
        <button class="btn" onclick="startGame()">Comenzar escape room →</button>
      </div>
    </div>`;
}

function startGame(){
  goToRoom(0);
  startTimer();
}

function renderEnd(app){
  clearInterval(timerInterval);
  app.innerHTML = `
    <div class="end-screen">
      <div class="room-eyebrow">Puerta principal</div>
      <h1>Has escapado.</h1>
      <p>Superaste las cuatro salas del laboratorio: clasificación ósea, esqueleto axial/apendicular, funciones del sistema óseo y regiones anatómicas longitudinales. Dominas la unidad completa.</p>
      <div>
        <button class="btn" onclick="location.reload()">Reiniciar</button>
      </div>
    </div>`;
}

function renderRoom(app, room){
  roomState[room.id] = roomState[room.id] || { verified: {}, correctCount: 0 };
  app.innerHTML = `
    <header class="top">
      <div>
        <div class="brand">SISTEMA ÓSEO // PROTOCOLO DE SALIDA</div>
        <div class="brand-sub">Sala ${room.id} de ${ROOMS.length}</div>
      </div>
      <div style="text-align:right;">
        <div class="timer" id="timerDisplay"></div>
        <div id="livesDisplay" style="font-size:20px; margin-top:4px;"></div>
      </div>
    </header>
    <div class="room-eyebrow">${room.eyebrow}</div>
    <h1 class="room-title">${room.title}</h1>
    <p class="briefing">${room.briefing}</p>
    <div id="challengeArea"></div>
    <div class="lock-panel disabled" id="lockPanel">
      <div class="lock-label">Panel de candado</div>
      <div class="lock-hint" id="lockHint">Resuelve el reto para desbloquear la pista del código.</div>
      <div class="lock-row">
        <input class="lock-input" id="lockInput" placeholder="CÓDIGO" ${false ? '' : 'disabled'}>
        <button class="btn btn-amber" id="lockBtn" onclick="tryUnlock(${room.id})" disabled>Desbloquear</button>
      </div>
      <div class="feedback" id="lockFeedback" style="margin-top:10px;"></div>
    </div>
  `;
  renderTimer();
  renderLives();
  renderChallenge(room);
}

function renderChallenge(room){
  const area = document.getElementById('challengeArea');
  if(room.type === 'mcq-set'){
    area.innerHTML = room.questions.map((q, qi) => `
      <div class="challenge-card">
        <div class="q-text">${qi+1}. ${q.q}</div>
        <div class="options" id="opts-${qi}">
          ${q.options.map(o => `<button class="opt-btn" onclick="selectMcq(${qi}, this, '${escapeStr(o)}')">${o}</button>`).join('')}
        </div>
      </div>
    `).join('') + `
      <div class="verify-row">
        <button class="btn" onclick="verifyMcqSet(${room.id})">Verificar respuestas</button>
        <span class="feedback" id="verifyFeedback"></span>
      </div>`;
  }
  else if(room.type === 'toggle-classify'){
    area.innerHTML = `
      <div class="challenge-card">
        ${room.items.map((it, i) => `
          <div class="q-text" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;">
            <span>${it.name}</span>
            <span class="options">
              <button class="opt-btn" id="tc-${i}-axial" onclick="selectToggle(${i}, 'Axial')">Axial</button>
              <button class="opt-btn" id="tc-${i}-apendicular" onclick="selectToggle(${i}, 'Apendicular')">Apendicular</button>
            </span>
          </div>
        `).join('')}
      </div>
      <div class="verify-row">
        <button class="btn" onclick="verifyToggle(${room.id})">Verificar clasificación</button>
        <span class="feedback" id="verifyFeedback"></span>
      </div>`;
  }
  else if(room.type === 'order'){
    area.innerHTML = `
      <div class="challenge-card">
        <div class="q-text">Arrastra los elementos para ordenarlos de <b>proximal</b> a <b>distal</b>:</div>
        <div class="order-list" id="orderList">
          ${shuffle([...room.items]).map((it,i) => `
            <div class="order-item" draggable="true" data-id="${it.id}">
              <span class="handle">⠿</span> ${it.label}
            </div>`).join('')}
        </div>
      </div>
      <div class="verify-row">
        <button class="btn" onclick="verifyOrder(${room.id})">Verificar orden</button>
        <span class="feedback" id="verifyFeedback"></span>
      </div>`;
    enableDrag();
  }
  else if(room.type === 'match-select'){
    area.innerHTML = `
      <div class="challenge-card">
        ${room.items.map((it,i) => `
          <div class="q-text" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;">
            <span>${it.name}</span>
            <select class="match-select" id="ms-${i}">
              <option value="">Selecciona...</option>
              ${it.options.map(o => `<option value="${escapeStr(o)}">${o}</option>`).join('')}
            </select>
          </div>
        `).join('')}
      </div>
      <div class="verify-row">
        <button class="btn" onclick="verifyMatch(${room.id})">Verificar relación</button>
        <span class="feedback" id="verifyFeedback"></span>
      </div>`;
  }
}

// ---- MCQ set ----
let mcqSelections = {};
function selectMcq(qi, btn, value){
  mcqSelections[qi] = value;
  const group = document.getElementById(`opts-${qi}`);
  group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}
function verifyMcqSet(roomId){
  const room = ROOMS.find(r => r.id === roomId);
  let correct = 0;
  room.questions.forEach((q, qi) => {
    const group = document.getElementById(`opts-${qi}`);
    const selected = mcqSelections[qi];
    group.querySelectorAll('.opt-btn').forEach(b => {
      b.disabled = true;
      if(b.textContent === q.answer) b.classList.add('correct');
      else if(b.textContent === selected && selected !== q.answer) b.classList.add('incorrect');
    });
    if(selected === q.answer) correct++;
  });
  const fb = document.getElementById('verifyFeedback');
  if(correct === room.questions.length){
    fb.textContent = `Correcto: ${correct}/${room.questions.length}. Candado desbloqueable.`;
    fb.className = 'feedback good';
    unlockLockPanel(room);
  } else {
    fb.textContent = `${correct}/${room.questions.length} correctas. Perdiste una vida 🦴. Revisa las marcadas en rojo e inténtalo de nuevo.`;
    fb.className = 'feedback bad';
    loseLife();
    setTimeout(() => { mcqSelections = {}; if(lives > 0) renderChallenge(room); }, 1800);
  }
}

// ---- Toggle classify ----
let toggleSelections = {};
function selectToggle(i, value){
  toggleSelections[i] = value;
  document.getElementById(`tc-${i}-axial`).classList.toggle('selected', value === 'Axial');
  document.getElementById(`tc-${i}-apendicular`).classList.toggle('selected', value === 'Apendicular');
}
function verifyToggle(roomId){
  const room = ROOMS.find(r => r.id === roomId);
  let correct = 0;
  room.items.forEach((it, i) => {
    const chosen = toggleSelections[i];
    const axialBtn = document.getElementById(`tc-${i}-axial`);
    const apeBtn = document.getElementById(`tc-${i}-apendicular`);
    [axialBtn, apeBtn].forEach(b => b.disabled = true);
    const correctBtn = it.answer === 'Axial' ? axialBtn : apeBtn;
    correctBtn.classList.add('correct');
    if(chosen && chosen !== it.answer){
      (it.answer === 'Axial' ? apeBtn : axialBtn).classList.add('incorrect');
    }
    if(chosen === it.answer) correct++;
  });
  const fb = document.getElementById('verifyFeedback');
  if(correct === room.items.length){
    fb.textContent = `Correcto: ${correct}/${room.items.length}. Candado desbloqueable.`;
    fb.className = 'feedback good';
    unlockLockPanel(room);
  } else {
    fb.textContent = `${correct}/${room.items.length} correctas. Perdiste una vida 🦴. Inténtalo de nuevo.`;
    fb.className = 'feedback bad';
    loseLife();
    setTimeout(() => { toggleSelections = {}; if(lives > 0) renderChallenge(room); }, 1800);
  }
}

// ---- Order ----
let dragSrc = null;
function enableDrag(){
  const list = document.getElementById('orderList');
  list.querySelectorAll('.order-item').forEach(item => {
    item.addEventListener('dragstart', e => { dragSrc = item; item.classList.add('dragging'); });
    item.addEventListener('dragend', e => item.classList.remove('dragging'));
    item.addEventListener('dragover', e => {
      e.preventDefault();
      const dragging = list.querySelector('.dragging');
      const after = getDragAfterElement(list, e.clientY);
      if(after == null) list.appendChild(dragging);
      else list.insertBefore(dragging, after);
    });
  });
}
function getDragAfterElement(container, y){
  const items = [...container.querySelectorAll('.order-item:not(.dragging)')];
  return items.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset) return { offset, element: child };
    else return closest;
  }, { offset: -Infinity }).element;
}
function verifyOrder(roomId){
  const room = ROOMS.find(r => r.id === roomId);
  const list = document.getElementById('orderList');
  const currentIds = [...list.querySelectorAll('.order-item')].map(el => el.dataset.id);
  const fb = document.getElementById('verifyFeedback');
  const isCorrect = JSON.stringify(currentIds) === JSON.stringify(room.correctOrder);
  if(isCorrect){
    fb.textContent = 'Orden correcto. Candado desbloqueable.';
    fb.className = 'feedback good';
    list.querySelectorAll('.order-item').forEach(el => el.setAttribute('draggable', 'false'));
    unlockLockPanel(room);
  } else {
    fb.textContent = 'El orden aún no es correcto. Perdiste una vida 🦴. Ajusta y vuelve a verificar.';
    fb.className = 'feedback bad';
    loseLife();
  }
}

// ---- Match select ----
function verifyMatch(roomId){
  const room = ROOMS.find(r => r.id === roomId);
  let correct = 0;
  room.items.forEach((it, i) => {
    const sel = document.getElementById(`ms-${i}`);
    sel.classList.remove('correct','incorrect');
    if(sel.value === it.answer){ sel.classList.add('correct'); correct++; }
    else if(sel.value !== ''){ sel.classList.add('incorrect'); }
  });
  const fb = document.getElementById('verifyFeedback');
  if(correct === room.items.length){
    fb.textContent = `Correcto: ${correct}/${room.items.length}. Candado desbloqueable.`;
    fb.className = 'feedback good';
    unlockLockPanel(room);
  } else {
    fb.textContent = `${correct}/${room.items.length} correctas. Perdiste una vida 🦴. Ajusta las marcadas en rojo.`;
    fb.className = 'feedback bad';
    loseLife();
  }
}

// ---- Lock panel ----
function unlockLockPanel(room){
  const panel = document.getElementById('lockPanel');
  panel.classList.remove('disabled');
  document.getElementById('lockHint').textContent = room.hint;
  document.getElementById('lockInput').disabled = false;
  document.getElementById('lockBtn').disabled = false;
}
function tryUnlock(roomId){
  const room = ROOMS.find(r => r.id === roomId);
  const input = document.getElementById('lockInput');
  const fb = document.getElementById('lockFeedback');
  const value = input.value.trim().toUpperCase().replace(/\s+/g,'');
  if(value === room.code){
    fb.textContent = '✓ Candado abierto. Avanzando a la siguiente sala...';
    fb.className = 'feedback good';
    setTimeout(() => goToRoom(currentRoom + 1), 1000);
  } else {
    fb.textContent = '✗ Código incorrecto. Perdiste una vida 🦴. Revisa la pista.';
    fb.className = 'feedback bad';
    loseLife();
  }
}

// ---- utils ----
function escapeStr(s){ return s.replace(/'/g, "\\'"); }
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
